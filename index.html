<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7C1D2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="攝類學">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>賽倉攝類學自學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: sticky top bar, chapter rail on the left (drawer on phones), one reading column on the right with per-chapter tabs. */
:root{
  --bg:#F1F0ED; --surface:#FFFFFF; --surface-2:#E7E4DF; --fg:#1F1A1B; --muted:#6A6163; --line:#D7D2CB;
  --maroon:#7C1D2A; --maroon-soft:#F2E4E5; --saffron:#A96F0E; --saffron-soft:#F6EBD5;
  --ok:#2E6A44; --ok-soft:#E0EFE5; --bad:#A3322A; --bad-soft:#F7E2DF;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-kai:"LXGW WenKai TC","DFKai-SB","標楷體","Kaiti TC",serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --surface:#1D1819; --surface-2:#2A2324; --fg:#ECE5E2; --muted:#A99D9F; --line:#3A3132;
  --maroon:#E58390; --maroon-soft:#3B2327; --saffron:#E3AE4C; --saffron-soft:#3A2F1B;
  --ok:#7DC896; --ok-soft:#1D3325; --bad:#F08E83; --bad-soft:#3F2320; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1D1819; --surface-2:#2A2324; --fg:#ECE5E2; --muted:#A99D9F; --line:#3A3132;
  --maroon:#E58390; --maroon-soft:#3B2327; --saffron:#E3AE4C; --saffron-soft:#3A2F1B;
  --ok:#7DC896; --ok-soft:#1D3325; --bad:#F08E83; --bad-soft:#3F2320; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--maroon)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);margin-left:.5em;letter-spacing:.08em}
.topbar .spacer{flex:1}
.overall{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.overall .bar{width:90px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--maroon)}
.menu-btn{display:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;white-space:nowrap;flex:none}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100% - 52px)}
.rail{border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg);position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto}
.rail-link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:.92rem;line-height:1.45}
.rail-link:hover{background:var(--surface-2)}
.rail-link[aria-current="page"]{background:var(--maroon-soft);color:var(--maroon);font-weight:700}
.rail-link .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem;min-width:1.6em}
.rail-link[aria-current="page"] .no{color:var(--maroon)}
.rail-link.unbuilt{color:var(--muted)}
.rail-link .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.dot.learning{background:var(--saffron);border-color:var(--saffron)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.part{margin-top:18px}
.part h3{font-family:var(--f-display);font-size:.8rem;letter-spacing:.2em;color:var(--muted);margin:0 10px 4px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin:18px 10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}

main{padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px);min-width:0}
.col{max-width:760px;margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.18em;color:var(--saffron);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.35;margin:.2em 0 .3em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:2em 0 .6em;text-wrap:balance}
h3{font-size:1rem;margin:1.4em 0 .4em}
p{margin:.6em 0}
.lead{font-size:1.06rem;color:var(--fg)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.85rem;color:var(--muted)}
.meta a{font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 14px;font-size:.95rem;border-bottom:2.5px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:700}
.tabs button:disabled{opacity:.45;cursor:default}

ul.clean{padding-left:1.2em;margin:.4em 0}
ul.clean li{margin:.35em 0}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.step b.n{font-family:var(--f-display);color:var(--maroon);font-size:1.05rem}
.step .name{font-weight:700}
.checkrow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.92rem}

/* 論式 card: the three members of a consequence, labeled the way a debate courtyard names them */
.arg{font-family:var(--f-kai);font-size:1.22rem;line-height:2.4;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.seg{display:inline-flex;flex-direction:column;align-items:center;line-height:1.3;vertical-align:bottom;margin:0 2px}
.seg small{font-family:var(--f-body);font-size:.62rem;letter-spacing:.12em;color:var(--muted);font-weight:500}
.seg span{padding:1px 6px;border-radius:5px}
.seg.s span{background:var(--surface-2)}
.seg.p span{background:var(--maroon-soft);color:var(--maroon)}
.seg.r span{background:var(--saffron-soft);color:var(--saffron)}
.answers{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.answers button,.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 18px;font-weight:500}
.answers button:hover:not(:disabled),.opt:hover:not(:disabled){border-color:var(--maroon);color:var(--maroon)}
.answers button:disabled,.opt:disabled{cursor:default}
.answers button.right,.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.answers button.wrong,.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:.93rem}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback b{margin-right:.4em}

.drill-sec{margin-top:26px}
.drill-sec h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.drill-sec h3 .claim{font-family:var(--f-kai);font-weight:400;color:var(--muted)}
.drill{margin-top:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:14px 0}
.btn{border:1.5px solid var(--maroon);background:var(--maroon);color:var(--surface);border-radius:8px;padding:6px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn:disabled{opacity:.5;cursor:default}
.stat{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}

/* 名相 tree */
.tree{margin-top:10px}
.node{border-left:2px solid var(--line);padding:4px 0 4px 14px;margin:6px 0 6px 4px}
.node.root{border-left:0;padding-left:0;margin-left:0}
.node-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.node-t{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.node.root>.node-h .node-t{font-size:1.3rem;color:var(--maroon)}
.def{font-family:var(--f-kai);font-size:.95rem;background:var(--maroon-soft);color:var(--maroon);padding:0 8px;border-radius:5px}
.def::before{content:"性相　";font-family:var(--f-body);font-size:.7rem;letter-spacing:.1em;opacity:.8}
.syn,.eg,.nt{font-size:.88rem;color:var(--muted);margin:2px 0}
.eg::before{content:"例　";color:var(--saffron);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-family:var(--f-kai);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 9px;font-size:.95rem}
.four{display:grid;grid-template-columns:auto 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.four>div{background:var(--surface);padding:10px 12px;font-size:.92rem}
.four .hd{background:var(--surface-2);font-weight:700;font-size:.82rem;color:var(--muted)}
.four .cell b{display:block;font-family:var(--f-kai);font-weight:700}
.tbl-wrap{overflow-x:auto}
table.defs{border-collapse:collapse;width:100%;font-size:.93rem;margin-top:8px}
table.defs td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.defs td:first-child{font-weight:700;white-space:nowrap}
table.defs td:last-child{font-family:var(--f-kai)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qprog{height:4px;background:var(--surface-2);border-radius:2px;margin:8px 0 14px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--saffron)}
.qtext{font-size:1.08rem;font-weight:500;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{border-radius:8px;text-align:left;padding:9px 14px}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:900;color:var(--maroon);font-variant-numeric:tabular-nums;line-height:1.1}
.wronglist{display:grid;gap:10px;margin-top:12px}
.wronglist .item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.92rem}

/* debate */
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:.9rem}
.modes button[aria-pressed="true"]{border-color:var(--maroon);background:var(--maroon-soft);color:var(--maroon);font-weight:700}
.log{display:grid;gap:12px;margin:16px 0}
.msg{max-width:92%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--surface);border:1px solid var(--line);justify-self:start}
.msg.me{background:var(--maroon-soft);justify-self:end}
.msg .who{display:block;font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.msg .arg{margin-top:10px;font-size:1.12rem}
.thinking{color:var(--muted);font-style:normal}
.composer{display:grid;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;border-top:1px solid var(--line)}
.composer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:160px;resize:vertical;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg)}
.composer select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:3px 6px}
.note{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px}

/* 學習路線 / 單元 */
.tabs button .tick{color:var(--ok);font-weight:900;margin-right:4px}
.goals{display:grid;gap:10px}
.goal{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.goal:hover{border-color:var(--maroon)}
.goal-no{width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:var(--maroon-soft);color:var(--maroon);font-family:var(--f-display);font-weight:900}
.goal.done .goal-no{background:var(--ok-soft);color:var(--ok)}
.goal-body{display:grid;gap:2px;min-width:0}
.goal-t{font-weight:700;font-size:1.02rem}
.goal-g{font-size:.92rem}
.goal-s{font-size:.8rem;color:var(--muted)}
.goal-m{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.meter{display:inline-block;width:80px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ok)}
.linkbtn{border:0;background:none;padding:0;color:var(--maroon);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px}
table.grid{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface)}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
table.grid th{background:var(--surface-2);font-size:.82rem;white-space:nowrap}
table.grid td.kai{font-family:var(--f-kai);font-size:1rem}
table.grid td.nowrap{white-space:nowrap;font-weight:700}
.checklist{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.checklist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.checklist input{width:1.15em;height:1.15em;margin-top:.3em;flex:none;accent-color:var(--ok)}
.checklist label{cursor:pointer}
.unit-head{margin-top:1.2em}
.unit-title{margin-top:.2em;font-size:1.45rem}
.goalbox{background:var(--saffron-soft);border-radius:8px;padding:8px 12px;margin:6px 0}
.goalbox b{color:var(--saffron)}
.block{margin-top:26px}
.block h3{font-family:var(--f-display);font-size:1.08rem;margin:0 0 .5em}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.drill-ctx{font-size:.78rem;color:var(--muted);display:flex;gap:10px;margin-bottom:4px}
.prev{border-radius:4px;padding:0 6px}
.prev.ok{background:var(--ok-soft);color:var(--ok)}
.prev.bad{background:var(--bad-soft);color:var(--bad)}
.drill{margin-top:14px}
.part-tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:auto}
.flow-steps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.flow-steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.flow-steps .n{font-family:var(--f-display);color:var(--maroon);font-size:1.05rem}
.flow-steps .name{font-weight:700}
/* 句型卡: one card per named sentence pattern */
.pat-list{display:grid;gap:12px}
.pat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--maroon);border-radius:8px;padding:12px 14px}
.pat-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pat-n{font-family:var(--f-display);color:var(--maroon);font-size:1rem}
.pat-name{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.pat-q{font-size:.85rem;color:var(--muted)}
.pat-f{font-family:var(--f-kai);font-size:1.05rem;background:var(--maroon-soft);border-radius:6px;padding:6px 10px;margin:4px 0 8px}
.pat dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.pat dt{font-size:.8rem;color:var(--muted);padding-top:.15em;white-space:nowrap}
.pat dd{margin:0}
.pat .kw{background:var(--saffron-soft);color:var(--saffron);border-radius:4px;padding:0 5px;font-weight:700}
.pat dd.warn{color:var(--bad)}
/* 科判圖: left-to-right bracket tree */
.kp-wrap{overflow-x:auto;padding:6px 2px 10px}
.kp-node{display:flex;align-items:center}
.kp-label{flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;display:grid;line-height:1.35;max-width:15em}
.kp-label b{font-family:var(--f-display)}
.kp-def{font-family:var(--f-kai);font-size:.8rem;color:var(--maroon)}
.kp-items{font-family:var(--f-kai);font-size:.85rem;color:var(--muted)}
.kp-wrap>.kp-node>.kp-label{border-color:var(--maroon);background:var(--maroon-soft)}
.kp-children{position:relative;padding-left:28px;display:flex;flex-direction:column}
.kp-children::before{content:"";position:absolute;left:0;top:50%;width:12px;border-top:1.5px solid var(--line)}
.kp-children>.kp-node{position:relative;padding:3px 0}
.kp-children>.kp-node::before{content:"";position:absolute;left:-16px;top:50%;width:16px;border-top:1.5px solid var(--line)}
.kp-children>.kp-node::after{content:"";position:absolute;left:-16px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.kp-children>.kp-node:first-child::after{top:50%}
.kp-children>.kp-node:last-child::after{bottom:50%}
.kp-children>.kp-node:only-child::after{display:none}
.kp-hint{display:none}
/* phones: the same 科判 read top-down, children indented under their parent */
@media (max-width:600px){
  .kp-wrap{overflow-x:visible}
  .kp-node{flex-direction:column;align-items:flex-start}
  .kp-label{max-width:100%}
  .kp-children{padding-left:16px;margin-left:14px}
  .kp-children::before{display:none}
  .kp-children>.kp-node::before{top:1.25em;width:14px}
  .kp-children>.kp-node:first-child::after{top:0}
  .kp-children>.kp-node:last-child::after{bottom:auto;height:1.25em}
  .kp-children>.kp-node:only-child::after{display:block}
}
/* 範圍圖: nested boxes, outer = 總 */
.nb{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px 8px;min-width:0}
.nb.d0{background:var(--surface)}
.nb.d1{background:var(--bg)}
.nb-h{font-family:var(--f-display);font-weight:700;font-size:.92rem;display:flex;gap:8px;align-items:baseline}
.nb-h small{font-family:var(--f-kai);font-weight:400;color:var(--maroon)}
.nb-in{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:flex-start}
.nb-in>.nb{flex:1 1 auto}
.chip.extra{border-style:dashed;border-width:1.5px;color:var(--muted);background:transparent}
.chip.eg{border-color:var(--saffron);background:var(--saffron-soft);color:var(--saffron)}
.nb-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.nb-legend>span{display:inline-flex;align-items:center;gap:6px}

/* 科判式小節 */
.toc-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:22px}
.toc-h{font-size:.75rem;letter-spacing:.18em;color:var(--muted);font-weight:700;margin-bottom:4px}
.toc{list-style:none;margin:0;padding:0}
.toc.l2,.toc.l3,.toc.l4{padding-left:1.4em;border-left:1.5px solid var(--line);margin:2px 0 4px .5em}
.toc button{border:0;background:none;padding:3px 4px;text-align:left;font-size:.93rem;line-height:1.5;border-radius:5px}
.toc button:hover{background:var(--surface-2);color:var(--maroon)}
.toc.l1>li>button{font-weight:700}
.toc .sec-no{color:var(--maroon);font-variant-numeric:tabular-nums}
.sec{scroll-margin-top:64px}
.sec.l1{margin-top:40px;padding-top:6px;border-top:2px solid var(--line)}
.sec.l2{margin-top:26px}
.sec.l3,.sec.l4{margin-top:22px;padding-left:14px;border-left:3px solid var(--surface-2)}
.sec-h{font-family:var(--f-display);text-wrap:balance;margin:0 0 .4em}
h2.sec-h{font-size:1.35rem}
h3.sec-h{font-size:1.1rem}
h4.sec-h{font-size:1rem}
.sec-h .sec-no{color:var(--maroon)}
.sec.l3>.sec-h .sec-no,.sec.l4>.sec-h .sec-no{color:var(--saffron)}
.sec-intro{color:var(--muted)}
.sec .block{margin-top:14px}
.see{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:12px;font-size:.88rem}
.see-h{font-size:.72rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.see-link{border:1px dashed var(--maroon);background:transparent;color:var(--maroon);border-radius:6px;padding:2px 10px;font-size:.88rem}
.see-link:hover{background:var(--maroon-soft)}
.practice{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px}
.practice-h{display:flex;gap:12px;align-items:baseline;font-size:.9rem}
.practice-h b{color:var(--saffron)}
.practice .drill{margin-top:10px}
details.toc-box>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;list-style:none}
details.toc-box>summary::-webkit-details-marker{display:none}
details.toc-box>summary::before{content:"▸";color:var(--maroon);font-size:.9rem;transition:transform .15s}
details.toc-box[open]>summary::before{transform:rotate(90deg)}
details.toc-box>summary .toc-h{margin:0;font-size:.85rem;letter-spacing:.1em;color:var(--fg)}
.toc-count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
details.toc-box[open]>.toc{margin-top:8px}
.toc button.here{background:var(--maroon-soft);color:var(--maroon);font-weight:700}
.toc .tick{color:var(--ok);font-weight:900}
.toc-note{margin:8px 0 0}
.page-prog{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.page-prog .meter{flex:1;max-width:220px}
.page-prog .meter i{background:var(--maroon)}
.crumb-trail{margin-top:18px}

.trail.l1 .sec-h{font-size:1.05rem}
.trail.l2 .sec-h,.trail.l3 .sec-h{font-size:.95rem;padding-left:1em}
.trail .sec-intro{margin:.2em 0 .6em;padding-left:1em}
.page .sec.cur{margin-top:14px;padding-top:0;border-top:0;padding-left:0;border-left:0}

.page-done{margin-top:18px;padding:8px 12px;border-radius:8px;background:var(--surface-2)}

.pg-btn{display:grid;gap:0;text-align:left;max-width:48%;line-height:1.35;padding:8px 14px}

.checklist .ref{flex:none;border:0;background:var(--maroon-soft);color:var(--maroon);border-radius:5px;padding:0 7px;font-size:.78rem;font-weight:700;margin-top:.25em;font-variant-numeric:tabular-nums}

.seg-player{margin-top:10px}

.seg-list .seg-unit{font-size:.78rem;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-top:8px}

/* 影片 */
.video-wrap{border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}

/* 動畫 */
.an{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px}
.an-svg{width:100%;height:auto;display:block;cursor:pointer;max-height:72vh}
.an .sh{opacity:0;transition:opacity .45s ease,transform .8s cubic-bezier(.3,.7,.3,1)}
.an .sh.on{opacity:1}
.an .sh.on.dim{opacity:.25}
.an rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .3s,fill .3s}
.an .t-b>rect{fill:var(--bg)}

.an .lbl{font-size:11.5px;font-weight:700}
.an .nlbl{font-size:13.5px;font-weight:700;font-family:var(--f-display)}
.an .nsub{font-size:9.5px;fill:var(--maroon);font-family:var(--f-kai)}
.an .clbl{font-size:11px;font-family:var(--f-kai)}

.an .dlbl{font-size:10.5px;font-weight:700}
.an .k-mark circle{stroke-width:1.5}
.an .k-mark.t-ok circle{fill:var(--ok-soft);stroke:var(--ok)}
.an .k-mark.t-bad circle{fill:var(--bad-soft);stroke:var(--bad)}
.an .mk{font-size:13px;font-weight:900}
.an .t-ok .mk{fill:var(--ok)}
.an .t-bad .mk{fill:var(--bad)}
.an .k-arrow line{stroke:var(--muted);stroke-width:1.6}
.an .k-arrow polygon{fill:var(--muted)}
.an .k-arrow.t-acc line{stroke:var(--maroon)} .an .k-arrow.t-acc polygon{fill:var(--maroon)}
.an .k-arrow.t-ok line{stroke:var(--ok);stroke-width:2.2} .an .k-arrow.t-ok polygon{fill:var(--ok)}
.an .k-arrow.t-bad line{stroke:var(--bad);stroke-width:2.2} .an .k-arrow.t-bad polygon{fill:var(--bad)}
.an .k-arrow.dashed line{stroke-dasharray:6 4}
.an .k-text.t-acc text{fill:var(--maroon)}
.an .k-text.t-bad text{fill:var(--bad);font-weight:700}
.an .k-text.t-sf text{fill:var(--saffron);font-weight:700}
.an-cap{min-height:3.3em;margin:10px 0 0;font-size:1rem;line-height:1.65}
.an-count{font-variant-numeric:tabular-nums;color:var(--saffron);font-weight:700;margin-right:.6em;font-size:.85rem}
.an-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.an-ctrl .btn{padding:5px 12px;font-size:.9rem}
.an-dots{display:flex;gap:5px;margin-left:auto}
.an-dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.an-dots i.on{background:var(--maroon)}
@media (prefers-reduced-motion:reduce){.an .sh{transition:none}}

/* 精讀 */
.mainline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.ml-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.ml-name{font-weight:700;display:flex;gap:8px;align-items:baseline}
.ml-name .n{font-family:var(--f-display);color:var(--maroon)}
.ml-where{font-size:.78rem;color:var(--saffron);font-weight:700;margin:2px 0 4px;letter-spacing:.04em}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
.jump button:hover{border-color:var(--maroon);color:var(--maroon)}
.rsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;scroll-margin-top:70px}
.rsec-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:10px}
.rsec-h .sec{font-family:var(--f-display);font-weight:900;color:var(--maroon);font-size:1.1rem;font-variant-numeric:tabular-nums}
.rsec-h .claim{font-family:var(--f-kai);font-size:1.15rem;font-weight:700}
.layer{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.93rem}
.layer p{margin:.3em 0 0}
.layer-h{font-size:.72rem;letter-spacing:.16em;color:var(--muted);font-weight:700}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-family:var(--f-kai);font-size:1rem;margin-top:2px}
.crumbs .sep{color:var(--muted)}
.crumbs .here{color:var(--maroon);font-weight:700}
.mark{display:inline-block;margin-top:4px;font-size:.85rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:5px;padding:0 8px}
details.tl{margin-top:12px}
details.tl summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--maroon);padding:4px 0}
ol.timeline{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.tl-step{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;align-items:start}
.role{font-size:.75rem;font-weight:700;text-align:center;border-radius:5px;padding:2px 0;margin-top:6px}
.role.self{background:var(--maroon-soft);color:var(--maroon)}
.role.other{background:var(--saffron-soft);color:var(--saffron)}
.step-body{min-width:0}
.step-body .arg{font-size:1.05rem;padding:6px 12px;line-height:2.2}
.say{font-family:var(--f-kai);font-size:1.05rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.ans{display:flex;gap:8px;align-items:center;padding-top:4px}
.ans-chip{font-family:var(--f-kai);font-weight:700;font-size:1.05rem}
.implied{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 6px}
.is-implied .role{opacity:.6}
.step-note{font-size:.86rem;color:var(--muted);margin-top:3px}
.takeaway{background:var(--maroon-soft);border-radius:8px;padding:8px 12px;margin:12px 0 0;font-size:.93rem}
.takeaway b{color:var(--maroon)}

.ghost-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.flow{display:grid;gap:8px;margin-top:10px}

.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}

  .menu-btn{display:inline-block}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:52px;left:0;bottom:0;width:min(300px,86vw);max-height:none;z-index:30;background:var(--surface);transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 0 100vmax transparent}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}

}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-controls="rail" aria-expanded="false">章節</button>
  <div class="brand">賽倉攝類學<small>自學辯經室</small></div>
  <div class="spacer"></div>
  <div class="overall" id="overall"></div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="章節"></nav>
  <main id="main"><div class="col"><p class="muted">載入中…</p></div></main>
</div>

<script>
/* ---------- chapter registry: the 26-chapter template ---------- */
const READER = v => `https://amec.amrtf.org/reader/B000041/${v}`;
const VOL_NAME = v => ["","","卷一","卷二","卷三","卷四","卷五","卷六","卷七","卷八","卷九","卷十","卷十一","卷十二","卷十三","卷十四"][v];
const CHAPTERS = [
  [1,"紅白顏色的單元",2],[2,"證有證無的單元",2],[3,"是反非反的單元",2],[4,"辨識反體的單元",3],
  [5,"一與異的單元",3],[6,"小因果的單元",4],[7,"境與有境的單元",4],[8,"總別的單元",5],
  [9,"相違相係屬的單元",6],[10,"性相名相的單元",6],[11,"恰派實法反法的單元",6],[12,"自宗實法反法的單元",7],
  [13,"周遍斷語的敘述軌則的單元",7],[14,"周遍八門的單元",8],[15,"承許軌則的單元",8],[16,"第六囀聲的單元",9],
  [17,"小應成的單元",10],[18,"三時的單元",11],[19,"自相共相的單元",12],[20,"除遣趣入與成立趣入的單元",12],
  [21,"詮類聲與詮聚聲的單元",13],[22,"遮破法成立法的單元",13],[23,"遣餘法的單元",13],[24,"大相違相係屬的單元",14],
  [25,"大應成的單元",14],[26,"大因果的單元",14]
].map(([no,title,vol])=>({no,title,vol,id:"ch"+String(no).padStart(2,"0")}));
const BUILT = new Set(["ch01","ch02","ch03"]);   // add a chapter id here once chapters/chNN.json exists
const PARTS = [["初級理路",1,8],["中級理路",9,17],["高級理路",18,26]];
const CN_NUM = n => { const d="〇一二三四五六七八九"; if(n<10) return d[n]; if(n<20) return "十"+(n%10?d[n%10]:""); return d[Math.floor(n/10)]+"十"+(n%10?d[n%10]:""); };
const partOf = no => PARTS.find(p=>no>=p[1]&&no<=p[2])[0];
// AI 辯論 only exists inside a claude.ai viewer; a copy hosted elsewhere (GitHub Pages) leaves the tab out.
const IN_CLAUDE = !!(window.claude && window.claude.use);

/* ---------- tiny DOM helper ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==="class") e.className=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="html") e.innerHTML=v;
    else e.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat()){ if(k==null||k===false) continue; e.append(k instanceof Node?k:String(k)); }
  return e;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- progress: per-person, db when available, browser storage as fallback ---------- */
const LS_KEY = "sts-progress-v1";
let progress = { chapters:{} };
try { const raw = localStorage.getItem(LS_KEY); if (raw) progress = JSON.parse(raw); } catch {}
let dbRef = null, saveTimer = null;
function chp(id){ return progress.chapters[id] ||= { drills:{}, quiz:{best:null,last:null,attempts:0,wrong:[]}, debates:0, readSource:false }; }
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ if(!dbRef) return; try { await dbRef.set(JSON.parse(JSON.stringify(progress))); } catch(e){ if(e?.code==="invalid_argument") dbRef=null; } }, 800);
  renderRail(); renderOverall();
}
function status(id){
  if (!BUILT.has(id)) return "unbuilt";
  const c = progress.chapters[id]; if (!c) return "new";
  if ((c.quiz?.best ?? 0) >= 80 && c.unitsTotal && c.unitsDone===c.unitsTotal) return "done";
  const touched = Object.keys(c.drills||{}).length || c.quiz?.attempts || c.debates || Object.keys(c.viewed||{}).length || Object.keys(c.prac||{}).length;
  return touched ? "learning" : "new";
}
(async ()=>{
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  dbRef = db.collection("data/users/"+uid).doc("progress");
  try {
    const snap = await dbRef.get();
    if (snap.exists){ const remote = snap.data(); if (remote?.chapters){ progress = JSON.parse(JSON.stringify(remote)); try{localStorage.setItem(LS_KEY, JSON.stringify(progress));}catch{} render(); } }
    else if (Object.keys(progress.chapters).length) { await dbRef.set(JSON.parse(JSON.stringify(progress))); }
  } catch {}
})();

/* ---------- routing ---------- */
let route = { page:"intro", tab:"path" };
function parseHash(){
  const h = location.hash.replace(/^#/,"");
  const m = h.match(/^(ch\d\d)(?:-([a-z]\w*)(?:-p(\d+))?)?$/);
  if (m && CHAPTERS.some(c=>c.id===m[1])) route = { page:m[1], tab: m[2] || "path", pg: +(m[3] || 0) };
  else route = { page:"intro", tab:"path", pg:0 };
}
// pg = page index inside a unit (0 = 單元導覽); units show one 科判 section per page
function go(page, tab="path", pg=0){ location.hash = page==="intro" ? "intro" : (tab==="path" ? page : page+"-"+tab+(pg ? "-p"+pg : "")); }
window.addEventListener("hashchange", ()=>{ parseHash(); render(); window.scrollTo(0,0); closeRail(); });

/* ---------- chapter data ---------- */
const cache = {};
async function loadChapter(id){
  if (cache[id]) return cache[id];
  const r = await fetch(`chapters/${id}.json`);
  if (!r.ok) throw new Error("fetch");
  return cache[id] = await r.json();
}

/* ---------- rail + overall ---------- */
const rail = document.getElementById("rail");
const menuBtn = document.getElementById("menuBtn");
menuBtn.onclick = ()=>{ const o = rail.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o); };
function closeRail(){ rail.classList.remove("open"); menuBtn.setAttribute("aria-expanded", false); }
document.addEventListener("click", e=>{ if (rail.classList.contains("open") && !rail.contains(e.target) && e.target!==menuBtn) closeRail(); });

function renderRail(){
  rail.replaceChildren(
    el("button",{class:"rail-link","aria-current":route.page==="intro"?"page":null,onclick:()=>go("intro")}, el("span",{class:"no"},"序"), "辯經入門與使用說明"),
    ...PARTS.map(([name,a,b])=> el("div",{class:"part"},
      el("h3",null,name),
      ...CHAPTERS.filter(c=>c.no>=a&&c.no<=b).map(c=>{
        const st = status(c.id);
        return el("button",{class:"rail-link"+(st==="unbuilt"?" unbuilt":""),"aria-current":route.page===c.id?"page":null,onclick:()=>go(c.id),title:st==="unbuilt"?"待建置":null},
          el("span",{class:"no"},c.no), c.title, el("span",{class:"dot "+st,"aria-label":{done:"已完成",learning:"學習中",new:"未開始",unbuilt:"待建置"}[st]}));
      })
    )),
    el("div",{class:"legend"},
      el("span",null,el("i",{class:"dot"}),"未開始"),
      el("span",null,el("i",{class:"dot learning"}),"學習中"),
      el("span",null,el("i",{class:"dot done"}),"已完成"))
  );
}
function renderOverall(){
  const done = CHAPTERS.filter(c=>status(c.id)==="done").length;
  document.getElementById("overall").replaceChildren(
    el("span",null,`已完成 ${done} / 26 章`), el("span",{class:"bar"}, el("i",{style:`width:${done/26*100}%`})));
}

/* ---------- 論式 card ---------- */
function argCard(s,p,r){
  return el("div",{class:"arg"},
    el("span",{class:"seg s"},el("small",null,"有法"),el("span",null,s)), "有法，應當",
    el("span",{class:"seg p"},el("small",null,"所立法"),el("span",null,p)), "，因為",
    el("span",{class:"seg r"},el("small",null,"因"),el("span",null,r)), "的緣故。");
}
function answerButtons(correct, onPick, opts){
  const wrap = el("div",{class:"answers"});
  const fb = el("div");
  for (const opt of (opts || ["承許","因不成","不遍"])){
    const b = el("button",{type:"button"},opt);
    b.onclick = ()=>{
      wrap.querySelectorAll("button").forEach(x=>{ x.disabled=true; if(x.textContent===correct) x.classList.add("right"); });
      if (opt!==correct) b.classList.add("wrong");
      onPick(opt===correct, fb);
    };
    wrap.append(b);
  }
  return [wrap, fb];
}

/* 整章影片：一支完整影片依單元切成數個檔（d.film.files），每一段對應一個小節（unit + ref）。

const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function filmFile(d, uid){ return d.film?.files.find(f=>f.unit===uid); }
function filmSeg(d, uid, ref){ return filmFile(d, uid)?.segments.find(s=>s.ref===ref); }
function segmentPlayer(ch, d, uid, ref, onNext){
  const f = filmFile(d, uid), s = filmSeg(d, uid, ref);
  if (!f || !s) return null;
  const v = el("video",{class:"unit-video",controls:true,playsinline:true,preload:"metadata",src:`${f.src}#t=${s.start},${s.end}`});
  const after = el("div",{class:"seg-after",hidden:true},
    el("button",{class:"btn ghost",type:"button",onclick:()=>{ v.currentTime = s.start; v.play().catch(()=>{}); }},"⟲ 再看一次"),
    onNext ? el("button",{class:"btn",type:"button",onclick:onNext},"下一節 →") : null);
  let guard = false;
  v.addEventListener("loadedmetadata", ()=>{ if (v.currentTime < s.start || v.currentTime > s.end) v.currentTime = s.start; });
  v.addEventListener("play", ()=>{ after.hidden = true; if (v.currentTime < s.start - .3 || v.currentTime >= s.end - .1) v.currentTime = s.start; guard = true; });
  v.addEventListener("timeupdate", ()=>{ if (guard && v.currentTime >= s.end - .05){ guard = false; v.pause(); after.hidden = false; } });
  v.addEventListener("error", ()=>v.replaceWith(el("p",{class:"note"},"影片載入失敗。請確認網路連線後重新整理。")), {once:true});
  return el("div",{class:"seg-player"},
    el("div",{class:"seg-h"}, el("b",null,"本節影片"), el("span",{class:"muted small"}, `${mmss(s.end - s.start)}　可按右下角全螢幕`)),
    el("div",{class:"video-wrap"}, v), after);
}
function noVideoNote(ch, d, uid, ref){

// 學習路線頁：整章連續播放
function chapterFilm(ch, d){
  if (!d.film) return null;
  const files = d.film.files, total = files.reduce((a,f)=>a+f.dur, 0);
  let cur = 0;

      segmentList(ch, d, files, (f, s)=>{ load(files.indexOf(f), s.start, true); v.scrollIntoView({block:"center"}); }))];

/* 單元：科判式的小節，一頁一節。一、→（一）→ 1. →(1)，ref 例如 "三(二)1(1)"，也是跨單元連結用的編號。
   頁面順序：單元導覽（目標、影片）→ 每個有內容的小節；一節的小練習全部答對就算完成。 */
let pendingScroll = null;
const secId = (uid, ref) => `sec-${uid}-${ref}`;
function secRef(prefix, no, level){ return level===1 ? no : (level===2 || level===4) ? `${prefix}(${no})` : `${prefix}${no}`; }
function secLabel(no, level){ return level===1 ? `${no}、` : level===2 ? `（${no}）` : level===3 ? `${no}. ` : `(${no}) `; }
const hasOwn = s => !!((s.blocks && s.blocks.length) || s.practice?.length || s.drills?.length);

// flatten the outline into pages; a heading-only section (only an intro) shows on its first descendant page
function unitPages(u){
  const pages = [{kind:"intro"}];
  const walk = (secs, level, prefix, trail) => {
    for (const s of secs){
      const ref = secRef(prefix, s.no, level), node = {sec:s, ref, level};
      if (hasOwn(s)) pages.push({kind:"sec", ...node, trail:[...trail]});
      walk(s.children || [], level+1, ref, [...trail, node]);
    }
  };
  walk(u.outline, 1, "", []);
  return pages;
}
function pageOfRef(u, ref){
  const pages = unitPages(u);
  const i = pages.findIndex(p => p.kind==="sec" && (p.ref===ref || p.trail.some(t=>t.ref===ref)));
  return i < 0 ? 0 : i;
}
function jumpTo(ch, uid, ref){
  const d = cache[ch.id], u = d?.units.find(x=>x.id===uid);
  if (!u) return go(ch.id, uid);
  go(ch.id, uid, pageOfRef(u, ref));
}

// 小練習：每一節有一個題庫（書中的論式＋練習題），每次隨機出 PICK 題；答對 PICK 題（題庫較小就全部）這一節就完成。
// 沒有練習的節，看過就算。上層的節看底下各節。
const PICK = 3;
function secItems(s){ return [...(s.drills||[]).map(id=>["d",id]), ...(s.practice||[]).map(id=>["q",id])]; }
function itemOk(c, [k,id]){ return (k==="d" ? c.drills[id] : c.prac?.[id]) === "ok"; }
function secNeed(s){ return Math.min(PICK, secItems(s).length); }
function secCorrect(ch, s){ const c = chp(ch.id); return secItems(s).filter(it=>itemOk(c, it)).length; }
function secDone(ch, u, s, ref){
  const c = chp(ch.id);
  const own = secItems(s);
  let ok = true;
  if (own.length) ok = secCorrect(ch, s) >= secNeed(s);
  else if (hasOwn(s)) ok = !!c.viewed?.[u.id]?.[ref];
  const kids = s.children || [];
  return ok && kids.every((k)=>secDone(ch, u, k, secRef(ref, k.no, refLevel(ref)+1)));
}
function refLevel(ref){ // "三"→1, "三(二)"→2, "三(二)1"→3, "三(二)1(1)"→4
  if (!ref.includes("(")) return 1;
  if (/\)$/.test(ref)) return ref.split("(").length-1 >= 2 ? 4 : 2;
  return 3;
}
function markViewed(ch, u, ref){
  const c = chp(ch.id); c.viewed ||= {}; const m = c.viewed[u.id] ||= {};
  if (!m[ref]){ m[ref] = true; save(); }
}

function seeLinks(ch, d, list){
  if (!list?.length) return null;
  return el("div",{class:"see"}, el("span",{class:"see-h"},"延伸"),
    ...list.map(x=>el("button",{class:"see-link",type:"button",onclick:()=>{
      if (x.page) return go(x.page);
      if (x.tab) return go(ch.id, x.tab);
      jumpTo(ch, x.unit, x.ref);
    }}, "→ ", x.label)));
}
function practiceBox(ch, d, sec, onChange){
  const c = chp(ch.id);
  const pool = [...(sec.drills||[]).map(id=>({k:"d", it:d.drills.find(x=>x.id===id)})),
                ...(sec.practice||[]).map(id=>({k:"q", it:d.quiz.find(x=>x.id===id)}))].filter(x=>x.it);
  if (!pool.length) return null;
  const need = Math.min(PICK, pool.length);
  const isOk = x => (x.k==="d" ? c.drills[x.it.id] : c.prac?.[x.it.id]) === "ok";
  const stat = el("span",{class:"stat"});
  const upd = ()=>{ const got = pool.filter(isOk).length;
    stat.textContent = `題庫 ${pool.length} 題，已答對 ${got} 題`; onChange?.(); };
  const list = el("div");
  const again = el("button",{class:"btn ghost",type:"button"},"換一組題目");
  const draw = ()=>{
    // 還沒答對的優先，其次是答對過的；每組隨機
    const pick = [...shuffle(pool.filter(x=>!isOk(x))), ...shuffle(pool.filter(isOk))].slice(0, need);
    list.replaceChildren(...pick.map(({k, it})=>{
      const fb = el("div");
      const prevMark = r => r ? el("span",{class:"prev "+r}, r==="ok"?"上次答對":"上次答錯") : null;
      if (k==="d"){
        const [btns] = answerButtons(it.a, ok=>{
          c.drills[it.id] = ok?"ok":"bad"; save(); upd();
          fb.replaceChildren(el("div",{class:"feedback "+(ok?"ok":"bad")}, el("b",null, ok?"答對。":`應答「${it.a}」。`), it.x));
        }, it.opts);
        return el("div",{class:"drill"}, el("div",{class:"drill-ctx"}, `原文 ${it.sec}`, prevMark(c.drills[it.id])), argCard(it.s,it.p,it.r), btns, fb);
      }
      return el("div",{class:"qcard drill"},
        c.prac?.[it.id] ? el("div",{class:"drill-ctx"}, prevMark(c.prac[it.id])) : null,
        ...qBody(it, ok=>{ c.prac ||= {}; c.prac[it.id] = ok?"ok":"bad"; save(); upd();
          fb.replaceChildren(el("div",{class:"feedback "+(ok?"ok":"bad")}, el("b",null, ok?"答對。":"答錯。"), it.x)); }),
        fb);
    }));
  };
  again.onclick = draw;
  again.hidden = pool.length <= need;
  draw(); upd();
  return el("div",{class:"practice"},
    el("div",{class:"practice-h"}, el("b",null,"小練習"), stat),
    el("p",{class:"small muted",style:"margin:4px 0 0"}, pool.length > need ? `每次隨機出 ${need} 題，答對 ${need} 題就完成這一節。` : `答對這 ${need} 題就完成這一節。`),
    list, el("div",{class:"toolbar"}, again));
}

// 本單元科判：預設收合；每一節後面顯示 ✓；目前這一節加底色
function outlineToc(ch, u, curRef){
  const pages = unitPages(u);
  const all = [];
  const mk = (secs, level, prefix) => el("ul",{class:"toc l"+level}, ...secs.map(s=>{
    const ref = secRef(prefix, s.no, level), done = secDone(ch, u, s, ref);
    if (hasOwn(s)) all.push(done);   // 只算有內容的節（和學習路線的「完成 x / n 節」一致）
    const here = curRef && (curRef===ref);
    return el("li",null,
      el("button",{type:"button",class:here?"here":null,"aria-current":here?"true":null,onclick:()=>go(ch.id, u.id, pageOfRef(u, ref))},
        el("span",{class:"sec-no"}, secLabel(s.no, level)), s.title, done ? el("span",{class:"tick","aria-label":"已完成"}," ✓") : null),
      s.children?.length ? mk(s.children, level+1, ref) : null);
  }));
  const list = mk(u.outline, 1, "");
  const n = all.length, got = all.filter(Boolean).length;
  return el("details",{class:"toc-box"},
    el("summary",null, el("span",{class:"toc-h"},"本單元科判"), el("span",{class:"toc-count"}, `已完成 ${got} / ${n} 節`), meter(got, n)),
    list,
    el("p",{class:"small muted toc-note"},"✓ 表示這一節的小練習答對了 3 題（題庫較小就全部）；沒有練習的節，看過就打勾。"));
}

function tabUnit(ch, d, u){
  const i = d.units.indexOf(u), pages = unitPages(u);
  const pg = Math.min(Math.max(route.pg || 0, 0), pages.length-1), P = pages[pg];
  const head = el("div",{class:"unit-head"},
    el("div",{class:"eyebrow"}, `單元${CN_NUM(i+1)} / ${CN_NUM(d.units.length)}`),
    el("h2",{class:"unit-title"}, u.title));
  const tocSlot = el("div");
  const drawToc = ()=>{ const open = tocSlot.firstChild?.open; tocSlot.replaceChildren(outlineToc(ch, u, P.ref)); if (open) tocSlot.firstChild.open = true; };
  const progress = el("div",{class:"page-prog"}, el("span",null,`第 ${pg+1} / ${pages.length} 頁`), meter(pg+1, pages.length));
  const body = el("div",{class:"page"});
  const doneLine = el("p",{class:"page-done small"});

  if (P.kind==="intro"){
    body.append(
      el("div",{class:"goalbox"}, el("b",null,"學習目標　"), u.goal),
      el("div",{class:"small muted"}, u.source),
      unitFilm(ch, d, u),
      el("p",{class:"muted small"}, `這個單元共 ${pages.length-1} 節，一次看一節。按下方「下一節」開始，或展開上面的「本單元科判」直接跳到想看的地方。`));
  } else {
    // 所在位置：上層各節的標題（第一次進到這一支時，連上層的導言一起顯示）
    const crumbs = el("div",{class:"crumb-trail"});
    for (const t of P.trail){
      const firstHere = pageOfRef(u, t.ref) === pg;
      const H = t.level===1 ? "h2" : t.level===2 ? "h3" : "h4";
      crumbs.append(el("div",{class:`trail l${t.level}`},
        el(H,{class:"sec-h"}, el("span",{class:"sec-no"}, secLabel(t.sec.no, t.level)), t.sec.title),
        firstHere && t.sec.intro ? el("p",{class:"sec-intro"}, t.sec.intro) : null));
    }
    const s = P.sec, H = P.level===1 ? "h2" : P.level===2 ? "h3" : "h4";
    const node = el("section",{class:`sec cur l${P.level}`, id:secId(u.id, P.ref)},
      el(H,{class:"sec-h"}, el("span",{class:"sec-no"}, secLabel(s.no, P.level)), s.title),
      s.intro ? el("p",{class:"sec-intro"}, s.intro) : null);
    const nextPg = pg < pages.length-1 ? ()=>go(ch.id, u.id, pg+1) : (i < d.units.length-1 ? ()=>go(ch.id, d.units[i+1].id, 0) : ()=>go(ch.id, "quiz"));
    node.append(segmentPlayer(ch, d, u.id, P.ref, nextPg) || noVideoNote(ch, d, u.id, P.ref) || "");
    for (const b of s.blocks||[]) node.append(renderBlock(ch, d, b));
    const see = seeLinks(ch, d, s.see); if (see) node.append(see);
    const drawDone = ()=>{
      const items = secItems(s);
      if (!items.length){ doneLine.textContent = "本節沒有小練習，看完就算完成。"; doneLine.className = "page-done small"; return; }
      const ok = secCorrect(ch, s), need = secNeed(s);
      doneLine.textContent = ok >= need ? `本節完成 ✓　已答對 ${ok} 題（題庫 ${items.length} 題，可以按「換一組題目」繼續練）。` : `本節已答對 ${ok} 題，答對 ${need} 題就完成這一節。`;
      doneLine.className = "page-done small" + (ok >= need ? " ok" : "");
    };
    const pr = practiceBox(ch, d, s, ()=>{ drawDone(); drawToc(); refreshBar(); });
    if (pr) node.append(pr);
    if (!secItems(s).length) markViewed(ch, u, P.ref);
    drawDone();
    body.append(crumbs, node);
  }
  drawToc();

  // 上一節／下一節：到頭尾就接到學習路線、上一單元或下一單元
  const pageName = (x) => x.kind==="intro" ? "單元導覽" : `${x.ref}　${x.sec.title}`;
  let prev, next;
  if (pg > 0) prev = [()=>go(ch.id, u.id, pg-1), pageName(pages[pg-1])];
  else if (i > 0){ const pu = d.units[i-1]; prev = [()=>go(ch.id, pu.id, unitPages(pu).length-1), `單元${CN_NUM(i)}・${pu.short}`]; }
  else prev = [()=>go(ch.id, "path"), "學習路線"];
  if (pg < pages.length-1) next = [()=>go(ch.id, u.id, pg+1), pageName(pages[pg+1])];
  else if (i < d.units.length-1){ const nu = d.units[i+1]; next = [()=>go(ch.id, nu.id, 0), `單元${CN_NUM(i+2)}・${nu.short}`]; }
  else next = [()=>go(ch.id, "quiz"), "綜合測驗"];
  const pager = el("div",{class:"pager"},
    el("button",{class:"btn ghost pg-btn",type:"button",onclick:prev[0]}, el("small",null,"← 上一節"), el("span",null,prev[1])),
    el("button",{class:"btn pg-btn",type:"button",onclick:next[0]}, el("small",null,"下一節 →"), el("span",null,next[1])));
  return [head, tocSlot, progress, body, P.kind==="sec" ? doneLine : null, pager].filter(Boolean);
}

/* 動畫: declarative SVG scenes. Each step shows/hides/highlights/moves shapes; state is rebuilt from step 0 so 上一步 always works. */
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids){ const e = document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs||{})) if (v!=null) e.setAttribute(k, v); kids.forEach(k=>e.append(k)); return e; }
function svText(txt, attrs){ const t = sv("text", attrs); t.textContent = txt; return t; }
function drawShape(sh){
  const g = sv("g",{class:`sh k-${sh.kind} t-${sh.tone||"base"}${sh.dash?" dashed":""}`});
  if (sh.kind==="box"){ g.append(sv("rect",{width:sh.w,height:sh.h,rx:10}), svText(sh.label,{x:10,y:18,class:"lbl"})); }
  if (sh.kind==="node"){
    g.append(sv("rect",{width:sh.w,height:sh.h,rx:8}), svText(sh.label,{x:sh.w/2,y:sh.sub?sh.h/2-2:sh.h/2+5,"text-anchor":"middle",class:"nlbl"}));
    if (sh.sub) g.append(svText(sh.sub,{x:sh.w/2,y:sh.h/2+12,"text-anchor":"middle",class:"nsub"}));
  }
  if (sh.kind==="chip"){ const w = [...sh.text].length*11+12; g.append(sv("rect",{width:w,height:20,rx:5}), svText(sh.text,{x:w/2,y:14,"text-anchor":"middle",class:"clbl"})); }
  if (sh.kind==="dot"){ g.append(sv("circle",{r:5.5}), svText(sh.text,{x:10,y:4,class:"dlbl"})); }
  if (sh.kind==="mark"){ g.append(sv("circle",{r:10}), svText(sh.tone==="ok"?"✓":"✕",{y:5,"text-anchor":"middle",class:"mk"})); }
  if (sh.kind==="text"){ g.append(svText(sh.text,{"text-anchor":sh.anchor||"start",class:"txt","font-size":sh.size||12})); }
  if (sh.kind==="arrow"){
    const {x1,y1,x2,y2} = sh, a = Math.atan2(y2-y1, x2-x1), L = 7;
    const p = (ang)=>`${x2 - L*Math.cos(a+ang)},${y2 - L*Math.sin(a+ang)}`;
    g.append(sv("line",{x1,y1,x2:x2-4*Math.cos(a),y2:y2-4*Math.sin(a)}), sv("polygon",{points:`${x2},${y2} ${p(0.45)} ${p(-0.45)}`}));
  }
  return g;
}
function animBlock(b){
  const svg = sv("svg",{viewBox:`0 0 ${b.w||360} ${b.h||300}`,class:"an-svg",role:"img","aria-label":b.title||"動畫"});
  const ids = b.shapes.map(s=>s.id), nodes = {};
  // paint containers first so moving cards, dots and marks always stay on top of them
  const LAYER = {box:0, arrow:1, node:2, chip:3, text:4, dot:5, mark:6};
  const painted = b.shapes.map((sh,i)=>[sh,i]).sort((p,q)=>(LAYER[p[0].kind]??3)-(LAYER[q[0].kind]??3) || p[1]-q[1]);
  for (const [sh] of painted){ const g = drawShape(sh); svg.append(g); nodes[sh.id] = {g, sh}; }
  const expand = list => (list||[]).flatMap(r => r.endsWith("*") ? ids.filter(x=>x.startsWith(r.slice(0,-1))) : [r]);
  const stateAt = i => {
    const st = Object.fromEntries(b.shapes.map(s=>[s.id,{on:false,hl:false,dim:false,x:s.x,y:s.y}]));
    for (let k=0; k<=i; k++){
      const s = b.steps[k];
      expand(s.show).forEach(id=>st[id].on=true); expand(s.hide).forEach(id=>st[id].on=false);
      expand(s.hl).forEach(id=>st[id].hl=true); expand(s.unhl).forEach(id=>st[id].hl=false);
      expand(s.dim).forEach(id=>st[id].dim=true); expand(s.undim).forEach(id=>st[id].dim=false);
      for (const [id,[x,y]] of Object.entries(s.move||{})){ st[id].x=x; st[id].y=y; }
    }
    return st;
  };
  const cap = el("p",{class:"an-cap","aria-live":"polite"});
  const dots = el("span",{class:"an-dots","aria-hidden":"true"}, ...b.steps.map(()=>el("i")));
  let cur = 0, timer = null;
  const show = i => {
    cur = Math.max(0, Math.min(b.steps.length-1, i));
    const st = stateAt(cur);
    for (const [id,{g,sh}] of Object.entries(nodes)){
      const v = st[id];
      g.classList.toggle("on", v.on); g.classList.toggle("hl", v.hl); g.classList.toggle("dim", v.dim);
      if (sh.kind!=="arrow") g.style.transform = `translate(${v.x}px,${v.y}px)`;
    }
    cap.replaceChildren(el("span",{class:"an-count"}, `${cur+1} / ${b.steps.length}`), b.steps[cur].cap);
    [...dots.children].forEach((d,k)=>d.classList.toggle("on", k<=cur));
    prevB.disabled = cur===0; nextB.disabled = cur===b.steps.length-1;
  };
  const stop = ()=>{ clearInterval(timer); timer=null; playB.textContent = "▶ 自動播放"; };
  const prevB = el("button",{class:"btn ghost",type:"button",onclick:()=>{ stop(); show(cur-1); }},"◀ 上一步");
  const nextB = el("button",{class:"btn",type:"button",onclick:()=>{ stop(); show(cur+1); }},"下一步 ▶");
  const playB = el("button",{class:"btn ghost",type:"button"},"▶ 自動播放");
  playB.onclick = ()=>{
    if (timer) return stop();
    if (cur===b.steps.length-1) show(0);
    playB.textContent = "❚❚ 暫停";
    timer = setInterval(()=>{ if (!svg.isConnected || cur>=b.steps.length-1) return stop(); show(cur+1); }, 3800);
  };
  const againB = el("button",{class:"btn ghost",type:"button",onclick:()=>{ stop(); show(0); }},"⟲ 重來");
  svg.addEventListener("click", ()=>{ stop(); show(cur+1); });
  const box = el("div",{class:"an"}, svg, cap, el("div",{class:"an-ctrl"}, prevB, nextB, playB, againB, dots));
  show(0);
  return box;
}

function kpNode(n){
  const label = el("div",{class:"kp-label"}, el("b",null,n.t),
    n.d ? el("span",{class:"kp-def"}, n.d) : null,
    n.items ? el("span",{class:"kp-items"}, n.items.join("、")) : null);

}
function nestLegend(n){
  const found = {items:null, extra:null, eg:null};
  (function scan(x){ for (const k of ["items","extra","eg"]) if (!found[k] && x[k]?.length) found[k] = x[k][0]; (x.c||[]).forEach(scan); })(n);
  return el("div",{class:"nb-legend"},
    found.items ? el("span",null, el("span",{class:"chip"},found.items), "書中列舉的項目") : null,
    found.extra ? el("span",null, el("span",{class:"chip extra"},found.extra), "也屬於這一類，但不在清單裡") : null,
    found.eg ? el("span",null, el("span",{class:"chip eg"},found.eg), "書中的例子") : null);
}
function nestBox(n, depth){
  const inner = [...(n.c||[]).map(x=>nestBox(x, depth+1)),
    ...(n.items||[]).map(t=>el("span",{class:"chip"},t)),
    ...(n.extra||[]).map(t=>el("span",{class:"chip extra",title:"也屬於這一類，但不在書中清單裡"},t)),
    ...(n.eg||[]).map(t=>el("span",{class:"chip eg",title:"書中的反例"},t))];
  return el("div",{class:"nb d"+(depth%2)},
    el("div",{class:"nb-h"}, n.t, n.note ? el("small",null,n.note) : null),
    inner.length ? el("div",{class:"nb-in"}, ...inner) : null);
}
function fourGrid(f){

    el("div",{class:"hd"}), el("div",{class:"hd"},`是${f.b}`), el("div",{class:"hd"},`不是${f.b}`),
    el("div",{class:"hd"},`是${f.a}`), el("div",{class:"cell"},el("b",null,cs[2].label),cs[2].eg), el("div",{class:"cell"},el("b",null,cs[0].label),cs[0].eg),
    el("div",{class:"hd"},`不是${f.a}`), el("div",{class:"cell"},el("b",null,cs[1].label),cs[1].eg), el("div",{class:"cell"},el("b",null,cs[3].label),cs[3].eg));
}

/* one book section: where it goes wrong, then the full exchange */
function roleTag(by){ return el("span",{class:"role "+(by==="自"?"self":"other")}, by==="自" ? "自宗" : "他宗"); }
function stepRow(st){
  const body = el("div",{class:"step-body"});
  if (st.arg) body.append(argCard(st.arg.s, st.arg.p, st.arg.r));
  if (st.t) body.append(el("div",{class:"say"}, st.t));
  if (st.a) body.append(el("div",{class:"ans"}, el("span",{class:"ans-chip"}, "答：", st.a), st.implied ? el("span",{class:"implied"},"書中省略") : null));
  if (st.n) body.append(el("div",{class:"step-note"}, st.n));
  return el("li",{class:"tl-step"+(st.implied?" is-implied":"")}, roleTag(st.by), body);
}
function layerBox(l){
  const path = el("div",{class:"crumbs"});
  l.path.forEach((p,i)=>{ if (i) path.append(el("span",{class:"sep","aria-hidden":"true"},"›")); path.append(el("span",{class:i===l.path.length-1?"here":null},p)); });
  return el("div",{class:"layer"}, el("div",{class:"layer-h"},"錯在哪一層"), path, l.mark ? el("div",{class:"mark"}, l.mark) : null, el("p",null,l.text));
}
function sectionCard(it, open){
  const det = el("details",{class:"tl"}, el("summary",null,`書中的辯論過程（${it.steps.length} 步）`), el("ol",{class:"timeline"}, ...it.steps.map(stepRow)));
  det.open = !!open;
  return el("section",{class:"rsec"},
    el("div",{class:"rsec-h"}, el("span",{class:"sec"}, it.sec), el("span",{class:"claim"}, it.claim), el("span",{class:"part-tag"}, it.part)),
    it.layer ? layerBox(it.layer) : null, det,
    it.takeaway ? el("p",{class:"takeaway"}, el("b",null,"記住　"), it.takeaway) : null);
}

/* 速查 */
function collectDefs(n, out=[]){ if (n.d) out.push([n.t,n.d]); (n.c||[]).forEach(c=>collectDefs(c,out)); return out; }
function tabRef(ch, d){
  return [
    el("p",{class:"muted small",style:"margin-top:1em"},"複習和辯論時隨手查。"),
    el("h2",null,"性相一覽"),
    el("div",{class:"tbl-wrap"}, el("table",{class:"grid"},
      el("thead",null, el("tr",null, el("th",null,"名相"), el("th",null,"性相"))),
      el("tbody",null, ...[...collectDefs(d.tree), ...(d.extraDefs||[])].map(([t,v])=>el("tr",null, el("td",{class:"nowrap"},t), el("td",{class:"kai"},v)))))),
    el("h2",null,"科判圖"), el("div",{class:"kp-wrap"}, kpNode(d.tree)),
    d.fourfold ? [el("h2",null,d.fourfold.title), fourGrid(d.fourfold)] : null,
    el("h2",null,"範圍圖"), nestBox(d.nest, 0), nestLegend(d.nest)
  ].flat().filter(Boolean);
}

/* 測驗 */
// One question (multiple choice, true/false, or a 論式 to answer); calls mark(ok) once.
function qBody(q, mark){
  if (q.type==="resp"){
    const [btns] = answerButtons(q.a, ok=>mark(ok), q.opts);
    return [el("div",{class:"qtext"},"這個論式應當怎麼回答？"), argCard(q.s,q.p,q.r), btns];
  }
  const opts = q.type==="tf" ? [["對",true],["錯",false]] : (q.fixed ? q.o.map((t,i)=>[t,i]) : shuffle(q.o.map((t,i)=>[t,i])));
  const wrap = el("div",{class:"opts"});
  for (const [label,val] of opts){
    const b = el("button",{class:"opt",type:"button"},label);
    b.onclick = ()=>{
      wrap.querySelectorAll("button").forEach(x=>{ x.disabled=true; if (x.dataset.v===String(q.a)) x.classList.add("right"); });
      const ok = val===q.a; if (!ok) b.classList.add("wrong"); mark(ok);
    };
    b.dataset.v = String(val); wrap.append(b);
  }
  return [el("div",{class:"qtext"}, q.type==="tf" ? "判斷對錯：" + q.q : q.q), wrap];
}
function tabQuiz(ch, d){
  const c = chp(ch.id);
  const box = el("div",{style:"margin-top:1em"});
  const start = (pool)=>{
    const items = shuffle(pool).slice(0, 10);
    let idx = 0, right = 0; const wrong = [];
    const step = ()=>{
      if (idx >= items.length) return finish();
      const q = items[idx];
      const card = el("div",{class:"qcard"},
        el("div",{class:"qhead"}, el("span",null,`第 ${idx+1} / ${items.length} 題`), el("span",null,`答對 ${right}`)),
        el("div",{class:"qprog"}, el("i",{style:`width:${idx/items.length*100}%`})));
      const fb = el("div");
      const next = el("button",{class:"btn",type:"button",hidden:true}, idx+1<items.length?"下一題":"看結果");
      next.onclick = ()=>{ idx++; step(); };
      const mark = ok=>{ if(ok) right++; else wrong.push(q); fb.replaceChildren(el("div",{class:"feedback "+(ok?"ok":"bad")}, el("b",null, ok?"答對。":"答錯。"), q.x)); next.hidden=false; next.focus(); };
      card.append(...qBody(q, mark), fb, el("div",{class:"toolbar"},next));
      box.replaceChildren(card);
    };
    const finish = ()=>{
      const score = Math.round(right/items.length*100);
      c.quiz.attempts = (c.quiz.attempts||0)+1; c.quiz.last = score;
      c.quiz.best = Math.max(c.quiz.best ?? 0, score);
      const wrongIds = new Set(c.quiz.wrong||[]);
      items.forEach(q=>{ if (wrong.includes(q)) wrongIds.add(q.id); else wrongIds.delete(q.id); });
      c.quiz.wrong = [...wrongIds]; save();
      box.replaceChildren(el("div",{class:"qcard"},
        el("div",{class:"score"}, score, el("span",{class:"small muted"}," 分")),
        el("p",null, score>=80 ? "達到 80 分，這一章標記為完成。" : "80 分以上算完成這一章。先看下面的錯題解說，再測一次。"),
        el("div",{class:"toolbar"},
          el("button",{class:"btn",type:"button",onclick:()=>start(d.quiz)},"再測一次"),
          c.quiz.wrong.length ? el("button",{class:"btn ghost",type:"button",onclick:()=>start(d.quiz.filter(q=>c.quiz.wrong.includes(q.id)))},`錯題複習（${c.quiz.wrong.length}）`) : null),
        wrong.length ? el("div",{class:"wronglist"}, ...wrong.map(q=>el("div",{class:"item"},
          el("div",null, el("b",null, q.type==="resp" ? `${q.s}有法，應當${q.p}，因為${q.r}的緣故。` : q.q)),
          el("div",{class:"muted"}, "正解：", q.type==="resp"?q.a : q.type==="tf" ? (q.a?"對":"錯") : q.o[q.a], "。", q.x)))) : null));
    };
    step();
  };
  const intro = el("div",{class:"qcard"},
    el("p",{style:"margin-top:0"},`題庫共 ${d.quiz.length} 題（包含各節小練習的題目），每回隨機抽 10 題，選項順序也會打亂。`),
    el("p",{class:"stat"}, c.quiz.attempts ? `最高 ${c.quiz.best} 分・上次 ${c.quiz.last} 分・已測 ${c.quiz.attempts} 次` : "還沒測過。"),
    el("div",{class:"toolbar"},
      el("button",{class:"btn",type:"button",onclick:()=>start(d.quiz)},"開始測驗"),
      (c.quiz.wrong||[]).length ? el("button",{class:"btn ghost",type:"button",onclick:()=>start(d.quiz.filter(q=>c.quiz.wrong.includes(q.id)))},`錯題複習（${c.quiz.wrong.length}）`) : null));
  box.append(intro);
  return box;
}

/* AI 辯論 */
const debateState = {};   // per chapter: {mode, turns:{debate:[],ask:[]}, busy, ctl}
function rulesFor(ch, d, mode){
  if (mode==="ask") return `你是《賽倉攝類學》的學習助教，正在協助一位自學者讀第${ch.no}章〈${ch.title}〉。
以下是本章要點，回答以此為準：
${d.ai.notes}

回答規則：用繁體中文，簡潔清楚，先直接回答再補充理由；需要時用本章的事例說明。若問題超出本章要點或你不確定，就直說，並建議對照原文。不要編造書中沒有的名相或出處。`;
  return `你現在扮演藏傳寺院辯經場上的「立宗者（問難者）」，用《賽倉攝類學》第${ch.no}章〈${ch.title}〉和一位自學的學生練習辯論。學生是「答辯者」。

以下是本章的要點，是你判斷對錯的唯一依據：
${d.ai.notes}

辯論規則：
1. 每次只提出一個應成論式，格式固定：「X有法，應當是Y，因為是Z的緣故。」否定句寫「應當不是Y」。
2. 學生會回答「承許」「因不成」「不遍」其中之一（第二章起也可能答「相違周遍」），可能附上理由。正確答法：先看宗，宗成立就承許；宗不成立時，因在有法上不成立答因不成，因成立答不遍；因成立而且是因就一定不是所立法，答相違周遍。
3. 你先用一兩句話判斷學生答得對不對、為什麼。答對時，依辯經程序往下追問：學生答「因不成」，你就提出成立該因的論式或換角度追問；答「不遍」，請他舉出反例，或提出下一個相關論式；答「承許」而且承許得對，就問更進一步的論式；承許錯了，就用「如果承許的話……」引出與自宗相違之處。答錯時，指出錯在哪一層分類，再給一個較簡單的論式讓他重來。
4. 由淺入深，涵蓋本章的他宗錯誤、自宗分類與斷諍中的名稱陷阱。可以用書中事例，也可以用同類的新事例，但只出本章要點能判斷的內容。
5. 用繁體中文，語氣像嚴格而慈悲的師兄，簡短，每次回覆不超過 120 字（論式不計）。
6. 每次回覆的最後一行一定是下一個論式，以「【論式】」開頭，例如：
【論式】白法螺的顏色有法，應當是紅色，因為是顏色的緣故。
7. 如果學生是在提問而不是回答，簡短回答後再給論式。`;
}
function parseReply(text){
  const i = text.lastIndexOf("【論式】");
  if (i<0) return { body:text.trim(), arg:null };
  const line = text.slice(i+4).split("\n")[0].trim();
  const m = line.match(/^(.+?)有法[，,]\s*應當(.+?)[，,]\s*因為(.+?)的緣故/);
  return { body:text.slice(0,i).trim(), arg: m ? {s:m[1].trim(), p:m[2].trim(), r:m[3].trim()} : null, raw: line };
}
const ERR = {
  not_granted:"這個頁面沒有取得使用 Claude 的許可，AI 功能已關閉。其他分頁不受影響。",
  sampling_disabled:"你的帳號目前無法從頁面使用 Claude。",
  rate_limited:"請求太頻繁或已達用量上限，請稍後再按一次。",
  session_expired:"登入已過期，請重新登入 claude.ai。",
  refused:"這一則沒有得到回覆，換個說法再試。",
  prompt_too_large:"對話太長了，按「重新開始」再試。",
};
function tabDebate(ch, d){
  const st = debateState[ch.id] ||= { mode:"debate", turns:{debate:[],ask:[]}, busy:false, tier:"default" };
  const wrap = el("div",{style:"margin-top:1em"});
  const log = el("div",{class:"log","aria-live":"polite"});
  const note = el("div");
  const modeBtns = el("div",{class:"modes",role:"group","aria-label":"模式"});
  let sample = null;

  const drawMsg = (m)=>{
    if (m.role==="user" && m.hidden) return null;
    if (m.role==="user") return el("div",{class:"msg me"}, el("span",{class:"who"},"我"), m.content);
    const pr = st.mode==="debate" ? parseReply(m.content) : { body:m.content, arg:null };
    return el("div",{class:"msg ai"}, el("span",{class:"who"}, st.mode==="debate"?"立宗者":"助教"),
      pr.body || null,
      pr.arg ? argCard(pr.arg.s, pr.arg.p, pr.arg.r) : (pr.raw ? el("div",{class:"arg"},pr.raw) : null));
  };
  const drawLog = ()=>{
    const turns = st.turns[st.mode];
    log.replaceChildren(...turns.map(drawMsg).filter(Boolean));
    if (!turns.length) log.append(el("div",{class:"note"},
      st.mode==="debate" ? "按「開始辯論」，立宗者會出第一個論式。你可以直接按承許、因不成、不遍，也可以在框裡補上理由。" : "問任何關於這一章的問題，例如：「支分色和八種支分色有什麼差別？」"));
  };

  const text = el("textarea",{id:"debateInput",placeholder: "補充理由或提問（可留空）"});
  const tierSel = el("select",{id:"tierSel","aria-label":"回覆模式"}, el("option",{value:"default"},"標準（較準）"), el("option",{value:"quick"},"快速"));
  tierSel.value = st.tier; tierSel.onchange = ()=>{ st.tier = tierSel.value; };
  const quick = el("div",{class:"answers"});
  const sendBtn = el("button",{class:"btn",type:"button"},"送出");
  const startBtn = el("button",{class:"btn",type:"button"},"開始辯論");
  const judgeBtn = el("button",{class:"btn ghost",type:"button"},"結束並總評");
  const stopBtn = el("button",{class:"btn ghost",type:"button",hidden:true},"停止");
  const resetBtn = el("button",{class:"btn ghost",type:"button"},"重新開始");

  const setBusy = b=>{ st.busy=b; [sendBtn,startBtn,judgeBtn,resetBtn,...quick.querySelectorAll("button")].forEach(x=>x.disabled=b); stopBtn.hidden=!b; };
  const refreshControls = ()=>{
    const turns = st.turns[st.mode];
    const started = turns.length>0;
    startBtn.hidden = st.mode!=="debate" || started;
    quick.hidden = st.mode!=="debate" || !started;
    judgeBtn.hidden = st.mode!=="debate" || !started;
    text.placeholder = st.mode==="debate" ? "補充理由（可留空），或直接輸入回答" : "輸入你的問題";
    modeBtns.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===st.mode));
  };

  const ask = async (userText, {hidden=false}={})=>{
    if (!sample || st.busy) return;
    const turns = st.turns[st.mode];
    turns.push({role:"user", content:userText, hidden});
    const bubble = el("div",{class:"msg ai"}, el("span",{class:"who"}, st.mode==="debate"?"立宗者":"助教"), el("span",{class:"thinking"},"思考中…"));
    drawLog(); log.append(bubble); bubble.scrollIntoView({block:"nearest"});
    setBusy(true); note.replaceChildren();
    st.ctl = new AbortController();
    const rules = rulesFor(ch, d, st.mode);
    const recent = turns.slice(-24).map(t=>({role:t.role, content:t.content}));
    if (recent[0]?.role !== "user") recent.shift();
    const input = [{role:"user", content:rules}, ...recent];
    try {
      const res = await sample(input, { cache:false, modelTier:st.tier, signal:st.ctl.signal,
        onText:({text})=>{ bubble.replaceChildren(el("span",{class:"who"}, st.mode==="debate"?"立宗者":"助教"), text); } });
      turns.push({role:"assistant", content:res.text});
      if (st.mode==="debate" && turns.filter(t=>t.role==="assistant").length===1){ chp(ch.id).debates = (chp(ch.id).debates||0)+1; save(); }
      if (res.truncated) note.replaceChildren(el("p",{class:"small muted"},"回覆被截斷了，可以請它說短一點。"));
    } catch(e){
      if (e?.text) turns.push({role:"assistant", content:e.text});
      else turns.pop();
      if (e?.code!=="cancelled") note.replaceChildren(el("p",{class:"note"}, ERR[e?.code] || "連線中斷了，再按一次試試。"));
      if (e?.code==="not_granted" || e?.code==="sampling_disabled") sample = null;
    } finally { setBusy(false); drawLog(); refreshControls(); }
  };

  for (const opt of (d.drills.some(x=>x.opts) ? ["承許","因不成","不遍","相違周遍"] : ["承許","因不成","不遍"])){
    quick.append(el("button",{type:"button",onclick:()=>{ const extra=text.value.trim(); text.value=""; ask(extra ? `${opt}。${extra}` : opt); }}, opt));
  }
  sendBtn.onclick = ()=>{ const v=text.value.trim(); if(!v) return; text.value=""; ask(v); };
  text.addEventListener("keydown", e=>{ if (e.key==="Enter" && (e.ctrlKey||e.metaKey)) sendBtn.click(); });
  startBtn.onclick = ()=>ask("請開始第一個論式。", {hidden:true});
  judgeBtn.onclick = ()=>ask("（辯論到此結束。請不要再出論式，改為總評：我答對與答錯的類型、最需要加強的一兩個觀念、建議回去重讀的段落。150 字內。）", {hidden:true});
  stopBtn.onclick = ()=>st.ctl?.abort();
  resetBtn.onclick = ()=>{ st.turns[st.mode] = []; drawLog(); refreshControls(); note.replaceChildren(); };
  for (const [m,label] of [["debate","我來答辯"],["ask","自由提問"]]){
    const b = el("button",{type:"button","data-m":m},label);
    b.onclick = ()=>{ if (st.busy) return; st.mode=m; drawLog(); refreshControls(); };
    modeBtns.append(b);
  }

  const composer = el("div",{class:"composer"},
    quick,
    el("div",{class:"row"}, text),
    el("div",{class:"row"}, startBtn, sendBtn, judgeBtn, stopBtn, resetBtn, el("span",{class:"spacer",style:"flex:1"}), tierSel));
  wrap.append(
    el("p",{class:"muted small"},"立宗者只依本章要點出題與判斷。辯論會使用你自己的 Claude 用量；第一次使用時 claude.ai 會詢問是否允許。"),
    modeBtns, log, note, composer);
  drawLog(); refreshControls();

  composer.hidden = true;
  const avail = el("div",{class:"note"},"正在連線 Claude…");
  wrap.insertBefore(avail, composer);
  (async ()=>{
    sample = window.claude?.use ? await claude.use("sample") : null;
    if (sample){ avail.remove(); composer.hidden = false; }
    else avail.textContent = "AI 辯論需要在 claude.ai 上開啟這個頁面才能使用。導讀、名相、演練、測驗都不受影響。";
  })();
  return wrap;
}

parseHash(); render();
</script>
